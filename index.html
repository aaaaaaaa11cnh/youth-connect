<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Youth Connect</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="phone">

<header>
<h2>Youth Connect</h2>
<i class="fa-solid fa-bell"></i>
</header>

<div class="welcome">

<h3>Hello, Alex! 👋</h3>

<p>Let's make today active!</p>

<button id="playBtn">Play Together</button>

</div>

<h3>Quick Actions</h3>

<div class="grid">

<div class="card">
<i class="fa-solid fa-basketball"></i>
<p>Book Court</p>
</div>

<div class="card">
<i class="fa-solid fa-users"></i>
<p>Communities</p>
</div>

<div class="card">
<i class="fa-solid fa-calendar-days"></i>
<p>Activities</p>
</div>

<div class="card">
<i class="fa-solid fa-user"></i>
<p>Profile</p>
</div>

</div>

<h3>Upcoming Activities</h3>

<div class="activity">
🏀 Basketball Match
<span>5 July • 4:00 PM</span>
</div>

<div class="activity">
⚽ Football Friendly
<span>8 July • 6:00 PM</span>
</div>

<nav>

<i class="fa-solid fa-house active"></i>

<i class="fa-solid fa-calendar"></i>

<i class="fa-solid fa-comments"></i>

<i class="fa-solid fa-user"></i>

</nav>

</div>

<script src="script.js"></script>

</body>
</html>
